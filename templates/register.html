<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NNC - Register Cadets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="logo-area">
            <span class="party-logo">🪳</span>
            <h1>NNC ENLISTMENT</h1>
            <p class="subtitle">Register Your Identity with the Congress</p>
        </div>
        
        <h2>Cadet Registration</h2>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form action="/register" method="POST" class="auth-form">
            <div class="form-group">
                <label for="real_name">Your Real Name</label>
                <input type="text" id="real_name" name="real_name" placeholder="Enter your official full name" required>
            </div>
            
            <div class="form-group">
                <label for="username">Choose Username</label>
                <input type="text" id="username" name="username" placeholder="Create a unique username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" placeholder="Set a strong password" required>
            </div>
            
            <button type="submit" class="btn btn-success">Submit Registration</button>
        </form>
        
        <div class="auth-footer">
            <p>Already registered? <a href="/login">Go to Login Gateway</a></p>
        </div>
    </div>
</body>
</html>
